<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CineStream - Movie Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">🎬 Cine<span>Stream</span></div>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search movies, actors, genres...">
    </div>
  </header>

  <!-- Genre Filter Pills -->
  <div class="filter-bar">
    <button class="filter-btn active" data-genre="All">All Movies</button>
    <button class="filter-btn" data-genre="Action">Action</button>
    <button class="filter-btn" data-genre="Sci-Fi">Sci-Fi</button>
    <button class="filter-btn" data-genre="Drama">Drama</button>
    <button class="filter-btn" data-genre="Animation">Animation</button>
  </div>

  <!-- Movie Grid Container -->
  <main class="main-container">
    <div id="movieGrid" class="movie-grid"></div>
  </main>

  <!-- Movie Details Modal -->
  <div id="movieModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModalBtn" class="close-btn">&times;</button>
      <div class="modal-body" id="modalBody">
        <!-- Populated dynamically via JS -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
